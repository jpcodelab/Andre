<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provincias de España — Misión André</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1923;--panel:#1a2a3a;--gold:#f5c842;--green:#3ddc84;--red:#ff5252;--blue:#4fc3f7;--white:#f0f4f8;--muted:#8899aa;--radius:14px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--white);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  #header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--panel);border-bottom:2px solid #2a3f55;flex-wrap:wrap;gap:8px;}
  #header h1{font-family:'Fredoka One',cursive;font-size:1.45rem;color:var(--gold);letter-spacing:1px;}
  #stats{display:flex;gap:16px;align-items:center;font-size:.85rem;font-weight:700;}
  .stat{text-align:center;}
  .stat-val{font-size:1.2rem;color:var(--gold);font-family:'Fredoka One',cursive;}
  .stat-lbl{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:1px;}
  #mode-bar{flex:0 0 auto;display:flex;gap:6px;padding:8px 16px;background:#141e28;overflow-x:auto;border-bottom:2px solid #2a3f55;}
  .mode-btn{padding:6px 14px;border-radius:20px;border:2px solid #2a3f55;background:transparent;color:var(--muted);font-family:'Nunito',sans-serif;font-weight:700;font-size:.78rem;cursor:pointer;white-space:nowrap;transition:all .2s;}
  .mode-btn:hover{border-color:var(--blue);color:var(--blue);}
  .mode-btn.active{background:var(--gold);border-color:var(--gold);color:#111;}
  #main{flex:1 1 auto;display:flex;gap:0;min-height:0;overflow:hidden;}
  #map-area{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px;position:relative;overflow:hidden;min-height:0;}
  #map-svg-container{width:100%;max-width:760px;height:100%;position:relative;display:flex;align-items:flex-start;justify-content:center;}
  #map-svg-container svg{width:100%;height:100%;max-height:100%;object-fit:contain;display:block;}
  .prov{stroke:#0f1923;stroke-width:1;cursor:pointer;transition:filter .15s,opacity .15s;}
  .prov:hover{filter:brightness(1.35);}
  .prov.mastered{opacity:.45;}
  .prov.target{stroke:var(--gold);stroke-width:2.5;filter:brightness(1.4) drop-shadow(0 0 6px var(--gold));animation:pulse-prov 1.2s ease-in-out infinite;}
  .prov.correct-flash{fill:var(--green)!important;}
  .prov.wrong-flash{fill:var(--red)!important;}
  @keyframes pulse-prov{0%,100%{filter:brightness(1.4) drop-shadow(0 0 4px var(--gold));}50%{filter:brightness(1.6) drop-shadow(0 0 10px var(--gold));}}
  .plabel{fill:rgba(255,255,255,.95);font-size:9px;font-weight:800;font-family:'Nunito',sans-serif;pointer-events:none;text-anchor:middle;dominant-baseline:middle;opacity:0;transition:opacity .25s;}
  .plabel.show-label{opacity:1;}
  #side{width:300px;min-width:260px;background:var(--panel);border-left:2px solid #2a3f55;display:flex;flex-direction:column;padding:16px;gap:14px;overflow-y:auto;}
  #question-box{background:#111e2a;border-radius:var(--radius);padding:16px;border:2px solid #2a3f55;text-align:center;}
  #question-label{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:6px;}
  #question-text{font-family:'Fredoka One',cursive;font-size:1.4rem;color:var(--gold);line-height:1.3;min-height:2.6rem;}
  #question-hint{margin-top:8px;font-size:.78rem;color:var(--muted);}
  #options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .opt-btn{padding:10px 8px;border-radius:10px;border:2px solid #2a3f55;background:#111e2a;color:var(--white);font-family:'Nunito',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;text-align:center;transition:all .15s;line-height:1.2;}
  .opt-btn:hover{border-color:var(--blue);color:var(--blue);background:#152030;}
  .opt-btn.correct{background:var(--green);border-color:var(--green);color:#0a1a0a;}
  .opt-btn.wrong{background:var(--red);border-color:var(--red);color:#fff;}
  .opt-btn:disabled{cursor:default;}
  #text-input-area{display:flex;gap:8px;}
  #text-input{flex:1;padding:10px 12px;border-radius:10px;border:2px solid #2a3f55;background:#111e2a;color:var(--white);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;outline:none;}
  #text-input:focus{border-color:var(--blue);}
  #text-input.correct{border-color:var(--green);background:#0d2010;}
  #text-input.wrong{border-color:var(--red);background:#200d0d;}
  #submit-btn{padding:10px 16px;border-radius:10px;border:none;background:var(--gold);color:#111;font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;}
  #submit-btn:hover{background:#ffd966;}
  #feedback{text-align:center;font-family:'Fredoka One',cursive;font-size:1.25rem;min-height:1.8rem;}
  #feedback.ok{color:var(--green);}
  #feedback.ko{color:var(--red);}
  #progress-section{flex:1;}
  #progress-title{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px;}
  #province-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;}
  .prov-dot{width:100%;aspect-ratio:1;border-radius:4px;font-size:.42rem;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;transition:background .3s;line-height:1.1;padding:1px;color:rgba(255,255,255,.9);}
  .prov-dot.unseen{background:#2a3f55;color:var(--muted);}
  .prov-dot.seen{background:#1e4a6e;}
  .prov-dot.good{background:#1e6e3a;}
  .prov-dot.mastered{background:var(--green);color:#0a1a0a;}
  .prov-dot.current{outline:2px solid var(--gold);}
  #master-bar-wrap{background:#111e2a;border-radius:10px;padding:10px 14px;border:2px solid #2a3f55;}
  #master-bar-label{display:flex;justify-content:space-between;font-size:.72rem;font-weight:700;margin-bottom:6px;color:var(--muted);}
  #master-bar-track{height:10px;background:#2a3f55;border-radius:5px;overflow:hidden;}
  #master-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:5px;transition:width .5s ease;}
  #celebration{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:30px;}
  #celebration.show{display:flex;}
  #celebration h2{font-family:'Fredoka One',cursive;font-size:2.4rem;color:var(--gold);}
  #celebration p{font-size:1.05rem;color:var(--white);max-width:400px;}
  #celebration button{padding:14px 32px;border-radius:30px;border:none;background:var(--gold);color:#111;font-family:'Fredoka One',cursive;font-size:1.1rem;cursor:pointer;}
  .confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;animation:confetti-fall linear forwards;pointer-events:none;z-index:101;}
  @keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}
  #tooltip{position:fixed;background:#1a2a3a;border:1px solid var(--gold);border-radius:8px;padding:6px 12px;font-size:.8rem;font-weight:700;color:var(--gold);pointer-events:none;display:none;z-index:50;}
  #next-btn{display:none;width:100%;padding:12px;border-radius:12px;border:none;background:var(--blue);color:#0a1520;font-family:'Fredoka One',cursive;font-size:1.1rem;cursor:pointer;}
  #next-btn:hover{background:#7dd8f8;}
  #next-btn.show{display:block;}
  @media (max-width:680px){html,body{height:auto;overflow:auto;}#main{flex-direction:column;height:auto;}#side{width:100%;min-width:unset;border-left:none;border-top:2px solid #2a3f55;}#map-area{min-height:340px;}#map-svg-container svg{height:auto;}}
</style>
</head>
<body>
<div id="header">
  <h1>🗺️ Provincias de España</h1>
  <div id="stats">
    <div class="stat"><div class="stat-val" id="s-streak">0</div><div class="stat-lbl">Racha</div></div>
    <div class="stat"><div class="stat-val" id="s-correct">0</div><div class="stat-lbl">Aciertos</div></div>
    <div class="stat"><div class="stat-val" id="s-mastered">0</div><div class="stat-lbl">Dominadas</div></div>
    <div class="stat"><div class="stat-val" id="s-total">50</div><div class="stat-lbl">Total</div></div>
  </div>
</div>
<div id="mode-bar">
  <button class="mode-btn active" data-mode="click-map">🖱️ Toca el mapa</button>
  <button class="mode-btn" data-mode="name-options">🔤 ¿Cómo se llama?</button>
  <button class="mode-btn" data-mode="capital-options">🏛️ Capitales</button>
  <button class="mode-btn" data-mode="ccaa-options">🏴 Comunidad</button>
  <button class="mode-btn" data-mode="type-name">⌨️ Escribe el nombre</button>
  <button class="mode-btn" data-mode="blitz">⚡ Blitz (30s)</button>
  <button id="toggle-names" class="mode-btn" style="margin-left:auto;border-color:#3ddc84;color:#3ddc84;">👁️ Nombres: OFF</button>
</div>
<div id="main">
  <div id="map-area">
    <div id="map-svg-container">
      <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" id="spain-map"></svg>
    </div>
  </div>
  <div id="side">
    <div id="question-box">
      <div id="question-label">PREGUNTA</div>
      <div id="question-text">Cargando...</div>
      <div id="question-hint"></div>
    </div>
    <div id="feedback"></div>
    <div id="options-grid" style="display:none"></div>
    <div id="text-input-area" style="display:none">
      <input type="text" id="text-input" placeholder="Escribe la provincia..." autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="submit-btn">→</button>
    </div>
    <button id="next-btn">Siguiente →</button>
    <div id="master-bar-wrap">
      <div id="master-bar-label"><span>Progreso hacia la maestría</span><span id="master-pct">0%</span></div>
      <div id="master-bar-track"><div id="master-bar-fill" style="width:0%"></div></div>
    </div>
    <div id="progress-section">
      <div id="progress-title">Estado por provincia</div>
      <div id="province-grid"></div>
    </div>
  </div>
</div>
<div id="celebration">
  <div style="font-size:4rem">🏆</div>
  <h2 id="cel-title">¡MISIÓN COMPLETADA!</h2>
  <p id="cel-msg"></p>
  <button onclick="resetGame()">Jugar de nuevo</button>
</div>
<div id="tooltip"></div>

const CCAA_COLORS={"Andalucía":"#e67e22","Aragón":"#8e44ad","Asturias":"#2980b9","Baleares":"#16a085","Canarias":"#f39c12","Cantabria":"#1abc9c","Castilla-La Mancha":"#c0392b","Castilla y León":"#d35400","Cataluña":"#27ae60","Comunidad Valenciana":"#e74c3c","Extremadura":"#a93226","Galicia":"#2471a3","La Rioja":"#117a65","Madrid":"#6c3483","Murcia":"#b7950b","Navarra":"#1d8348","País Vasco":"#0e6655"};
const MASTERY_THRESHOLD=4;
let state={mode:"click-map",scores:{},currentProv:null,answeredThisTurn:false,blitzActive:false,blitzTimer:null,blitzSeconds:30,globalStreak:0,totalCorrect:0,namesVisible:false};
function initScores(){PROVINCES.forEach(p=>{state.scores[p.id]={seen:0,correct:0,streak:0,mastered:false};});}
const SVGNS="http://www.w3.org/2000/svg";
function buildMap(){
  const svg=document.getElementById("spain-map");svg.innerHTML="";
  // Canarias box
  const cb=CAN_BOX;
  const box=document.createElementNS(SVGNS,"rect");
  box.setAttribute("x",cb[0]);box.setAttribute("y",cb[1]);box.setAttribute("width",cb[2]);box.setAttribute("height",cb[3]);
  box.setAttribute("rx","6");box.setAttribute("fill","none");box.setAttribute("stroke","#2a3f55");box.setAttribute("stroke-width","1.5");
  svg.appendChild(box);
  const cl=document.createElementNS(SVGNS,"text");
  cl.setAttribute("x",cb[0]+4);cl.setAttribute("y",cb[1]+12);cl.setAttribute("fill","#4a6a8a");cl.setAttribute("font-size","9");cl.textContent="CANARIAS";
  svg.appendChild(cl);
  PROVINCES.forEach(prov=>{
    const color=CCAA_COLORS[prov.ccaa]||"#555";
    const path=document.createElementNS(SVGNS,"path");
    path.setAttribute("d",prov.d);path.setAttribute("fill",color);path.setAttribute("class","prov");
    path.setAttribute("id","prov-"+prov.id);path.setAttribute("data-id",prov.id);
    path.addEventListener("click",()=>onMapClick(prov.id));
    path.addEventListener("mouseenter",e=>showTooltip(e,prov));
    path.addEventListener("mouseleave",hideTooltip);
    svg.appendChild(path);
  });
  // labels on top
  PROVINCES.forEach(prov=>{
    const t=document.createElementNS(SVGNS,"text");
    t.setAttribute("x",prov.lx);t.setAttribute("y",prov.ly);t.setAttribute("class","plabel");
    t.setAttribute("id","label-"+prov.id);
    let nm=prov.name;if(nm.length>9)nm=nm.split(" ")[0];
    t.textContent=nm;
    svg.appendChild(t);
  });
}
function showTooltip(e,prov){if(!state.namesVisible&&!state.scores[prov.id].mastered)return;const t=document.getElementById("tooltip");t.textContent=prov.name;t.style.display="block";t.style.left=(e.clientX+12)+"px";t.style.top=(e.clientY-4)+"px";}
function hideTooltip(){document.getElementById("tooltip").style.display="none";}
function refreshLabels(){PROVINCES.forEach(p=>{const t=document.getElementById("label-"+p.id);if(!t)return;const show=state.namesVisible||state.scores[p.id].mastered;t.classList.toggle("show-label",show);});}
function updateMapColors(){PROVINCES.forEach(p=>{const el=document.getElementById("prov-"+p.id);if(!el)return;el.classList.toggle("mastered",state.scores[p.id].mastered);});refreshLabels();}
function highlightTarget(id){document.querySelectorAll(".prov").forEach(el=>el.classList.remove("target"));if(id){const el=document.getElementById("prov-"+id);if(el)el.classList.add("target");}}
function flashProv(id,type){const el=document.getElementById("prov-"+id);if(!el)return;el.classList.remove("target");el.classList.add(type+"-flash");setTimeout(()=>el.classList.remove(type+"-flash"),700);}
function weightedPick(){
  const pool=PROVINCES.filter(p=>!state.scores[p.id].mastered);
  if(pool.length===0)return PROVINCES[Math.floor(Math.random()*PROVINCES.length)];
  const weights=pool.map(p=>{const sc=state.scores[p.id];const cr=sc.seen>0?sc.correct/sc.seen:0;return Math.max(.05,1-cr+.2*(1-Math.min(sc.seen,5)/5));});
  const total=weights.reduce((a,b)=>a+b,0);let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i];}
  return pool[pool.length-1];
}
function getOptions(correct,field,count=4){const others=PROVINCES.filter(p=>p.id!==correct.id);shuffle(others);const opts=[correct,...others.slice(0,count-1)];shuffle(opts);return opts.map(p=>({value:p[field],correct:p.id===correct.id}));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function nextQuestion(){
  state.answeredThisTurn=false;state.currentProv=weightedPick();const prov=state.currentProv;
  clearUI();highlightTarget(null);
  document.getElementById("next-btn").classList.remove("show");
  document.getElementById("feedback").textContent="";document.getElementById("feedback").className="";
  if(state.mode==="click-map"){setQuestion("¿Dónde está?",prov.name,"Haz clic en el mapa");}
  else if(state.mode==="name-options"){setQuestion("¿Cómo se llama la provincia señalada?","");highlightTarget(prov.id);showOptions(getOptions(prov,"name"));}
  else if(state.mode==="capital-options"){setQuestion("¿Cuál es la capital de...?",prov.name);showOptions(getOptions(prov,"capital"));}
  else if(state.mode==="ccaa-options"){setQuestion("¿A qué comunidad pertenece?",prov.name);showCcaaOptions(prov);}
  else if(state.mode==="type-name"){setQuestion("Escribe el nombre de la provincia señalada","");highlightTarget(prov.id);showTextInput();}
  else if(state.mode==="blitz"){startBlitzQuestion();}
}
function setQuestion(label,main,hint=""){document.getElementById("question-label").textContent=label;document.getElementById("question-text").textContent=main;document.getElementById("question-hint").textContent=hint;}
function clearUI(){const g=document.getElementById("options-grid");g.style.display="none";g.innerHTML="";document.getElementById("text-input-area").style.display="none";const inp=document.getElementById("text-input");inp.value="";inp.className="";}
function showOptions(opts){const grid=document.getElementById("options-grid");grid.style.display="grid";grid.innerHTML="";opts.forEach(opt=>{const btn=document.createElement("button");btn.className="opt-btn";btn.textContent=opt.value;btn.addEventListener("click",()=>handleOptionClick(btn,opt.correct,opts));grid.appendChild(btn);});}
function showCcaaOptions(prov){const list=[...new Set(PROVINCES.map(p=>p.ccaa))];const opts=[prov.ccaa];const others=list.filter(c=>c!==prov.ccaa);shuffle(others);opts.push(...others.slice(0,3));shuffle(opts);showOptions(opts.map(c=>({value:c,correct:c===prov.ccaa})));}
function handleOptionClick(btn,isCorrect,opts){
  if(state.answeredThisTurn)return;state.answeredThisTurn=true;
  document.querySelectorAll(".opt-btn").forEach(b=>b.disabled=true);
  if(isCorrect){btn.classList.add("correct");flashProv(state.currentProv.id,"correct");onCorrect();}
  else{btn.classList.add("wrong");document.querySelectorAll(".opt-btn").forEach(b=>{const o=opts.find(o=>o.value===b.textContent);if(o&&o.correct)b.classList.add("correct");});flashProv(state.currentProv.id,"wrong");onWrong();}
  document.getElementById("next-btn").classList.add("show");
}
function showTextInput(){document.getElementById("text-input-area").style.display="flex";setTimeout(()=>document.getElementById("text-input").focus(),100);}
function handleTextSubmit(){
  if(state.answeredThisTurn){nextQuestion();return;}
  const inp=document.getElementById("text-input");const val=normalize(inp.value);const correct=normalize(state.currentProv.name);
  if(val.length===0)return;state.answeredThisTurn=true;
  if(val===correct||(correct.startsWith(val)&&val.length>=4)){inp.className="correct";flashProv(state.currentProv.id,"correct");onCorrect();}
  else{inp.className="wrong";flashProv(state.currentProv.id,"wrong");document.getElementById("feedback").textContent="Era: "+state.currentProv.name;document.getElementById("feedback").className="ko";onWrong();}
  document.getElementById("next-btn").classList.add("show");
}
function normalize(s){return s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").trim();}
function onMapClick(id){
  if(state.mode!=="click-map")return;if(state.answeredThisTurn)return;
  state.answeredThisTurn=true;
  if(id===state.currentProv.id){flashProv(id,"correct");onCorrect();}
  else{flashProv(id,"wrong");flashProv(state.currentProv.id,"correct");onWrong();}
  document.getElementById("next-btn").classList.add("show");
}
function startBlitzQuestion(){
  if(!state.blitzActive){state.blitzActive=true;state.blitzSeconds=30;runBlitzTimer();}
  const prov=state.currentProv;
  setQuestion("⚡ BLITZ — "+state.blitzSeconds+"s",prov.name,"¿A qué comunidad pertenece?");
  const list=[...new Set(PROVINCES.map(p=>p.ccaa))];const opts=[prov.ccaa];const others=list.filter(c=>c!==prov.ccaa);shuffle(others);opts.push(...others.slice(0,3));shuffle(opts);
  const o=opts.map(c=>({value:c,correct:c===prov.ccaa}));
  const grid=document.getElementById("options-grid");grid.style.display="grid";grid.innerHTML="";
  o.forEach(opt=>{const btn=document.createElement("button");btn.className="opt-btn";btn.textContent=opt.value;
    btn.addEventListener("click",()=>{if(state.answeredThisTurn)return;state.answeredThisTurn=true;document.querySelectorAll(".opt-btn").forEach(b=>b.disabled=true);
      if(opt.correct){btn.classList.add("correct");flashProv(prov.id,"correct");onCorrect();}else{btn.classList.add("wrong");flashProv(prov.id,"wrong");onWrong();}
      setTimeout(()=>{if(state.mode==="blitz"&&state.blitzActive)nextQuestion();},800);});
    grid.appendChild(btn);});
  highlightTarget(prov.id);
}
function runBlitzTimer(){if(state.blitzTimer)clearInterval(state.blitzTimer);state.blitzTimer=setInterval(()=>{state.blitzSeconds--;
  if(state.mode==="blitz"&&state.currentProv)document.getElementById("question-label").textContent="⚡ BLITZ — "+state.blitzSeconds+"s";
  if(state.blitzSeconds<=0){clearInterval(state.blitzTimer);state.blitzTimer=null;state.blitzActive=false;setQuestion("⏱️ ¡Tiempo!","","Cambia de modo o juega de nuevo");clearUI();}},1000);}
function onCorrect(){
  const sc=state.scores[state.currentProv.id];sc.seen++;sc.correct++;sc.streak++;
  if(sc.streak>=MASTERY_THRESHOLD&&!sc.mastered){sc.mastered=true;showFeedback("🌟 ¡Dominada!",true);}
  else{const m=["✅ ¡Correcto!","🎯 ¡Exacto!","⭐ ¡Muy bien!","🔥 ¡Sí!"];showFeedback(m[Math.floor(Math.random()*m.length)],true);}
  state.globalStreak++;state.totalCorrect++;updateStats();updateProgressGrid();updateMapColors();checkVictory();
}
function onWrong(){
  const sc=state.scores[state.currentProv.id];sc.seen++;sc.streak=0;
  const m=["❌ Casi...","🔁 Sigue intentando","💪 La próxima"];
  if(!document.getElementById("feedback").textContent)showFeedback(m[Math.floor(Math.random()*m.length)],false);
  state.globalStreak=0;updateStats();updateProgressGrid();
}
function showFeedback(msg,ok){const el=document.getElementById("feedback");if(!el.textContent){el.textContent=msg;el.className=ok?"ok":"ko";}}
function updateStats(){const mastered=PROVINCES.filter(p=>state.scores[p.id].mastered).length;document.getElementById("s-streak").textContent=state.globalStreak;document.getElementById("s-correct").textContent=state.totalCorrect;document.getElementById("s-mastered").textContent=mastered;const pct=Math.round(mastered/PROVINCES.length*100);document.getElementById("master-pct").textContent=pct+"%";document.getElementById("master-bar-fill").style.width=pct+"%";}
function updateProgressGrid(){const grid=document.getElementById("province-grid");grid.innerHTML="";PROVINCES.forEach(p=>{const sc=state.scores[p.id];const div=document.createElement("div");div.className="prov-dot";div.title=p.name;div.textContent=p.name.substring(0,4);if(sc.mastered)div.classList.add("mastered");else if(sc.correct>=2)div.classList.add("good");else if(sc.seen>0)div.classList.add("seen");else div.classList.add("unseen");if(state.currentProv&&p.id===state.currentProv.id)div.classList.add("current");grid.appendChild(div);});}
function checkVictory(){const mastered=PROVINCES.filter(p=>state.scores[p.id].mastered).length;
  if(mastered===PROVINCES.length){spawnConfetti();setTimeout(()=>{document.getElementById("cel-title").textContent="🏆 ¡MISIÓN COMPLETADA!";document.getElementById("cel-msg").textContent="Has dominado las 50 provincias de España con "+state.totalCorrect+" respuestas correctas. ¡Eres un experto geógrafo!";document.getElementById("celebration").classList.add("show");},600);}
  else if(mastered>0&&mastered%10===0){spawnConfetti(30);showFeedback("🎉 ¡"+mastered+" provincias dominadas!",true);}}
function spawnConfetti(n=80){const colors=["#f5c842","#3ddc84","#4fc3f7","#ff5252","#c084fc","#fb923c"];for(let i=0;i<n;i++){const div=document.createElement("div");div.className="confetti-piece";div.style.left=Math.random()*100+"vw";div.style.top="-10px";div.style.background=colors[Math.floor(Math.random()*colors.length)];div.style.width=(8+Math.random()*8)+"px";div.style.height=(8+Math.random()*8)+"px";div.style.animationDuration=(1.5+Math.random()*2)+"s";div.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(div);setTimeout(()=>div.remove(),4000);}}
function resetGame(){document.getElementById("celebration").classList.remove("show");initScores();state.globalStreak=0;state.totalCorrect=0;state.blitzActive=false;if(state.blitzTimer)clearInterval(state.blitzTimer);state.blitzTimer=null;updateStats();updateProgressGrid();updateMapColors();nextQuestion();}
document.querySelectorAll(".mode-btn").forEach(btn=>{btn.addEventListener("click",()=>{document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");state.mode=btn.dataset.mode;state.blitzActive=false;if(state.blitzTimer)clearInterval(state.blitzTimer);state.blitzTimer=null;nextQuestion();});});
document.getElementById("next-btn").addEventListener("click",nextQuestion);
document.getElementById("submit-btn").addEventListener("click",handleTextSubmit);
document.getElementById("text-input").addEventListener("keydown",e=>{if(e.key==="Enter")handleTextSubmit();});
document.getElementById("toggle-names").addEventListener("click",()=>{state.namesVisible=!state.namesVisible;const b=document.getElementById("toggle-names");b.textContent=state.namesVisible?"👁️ Nombres: ON":"👁️ Nombres: OFF";b.style.background=state.namesVisible?"#3ddc84":"transparent";b.style.color=state.namesVisible?"#0a1a0a":"#3ddc84";refreshLabels();});
initScores();buildMap();updateProgressGrid();updateStats();refreshLabels();nextQuestion();
</script>
</body>
</html>
